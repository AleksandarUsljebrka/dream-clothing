<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stranica ne postoji - Dream Clothing</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0a09">
  <!-- GitHub Pages prikazuje ovu stranicu za svaku adresu koja ne postoji.
       Stilovi su ovde u fajlu, a link je puna adresa, jer se stranica otvara sa bilo koje putanje. -->
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 28px;
      padding: 0 clamp(16px, 6vw, 96px);
      background: #0b0a09; color: #efe9df;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.5;
    }
    .logo { font-weight: 900; font-size: 28px; letter-spacing: -.06em; }
    h1 { margin: 0; font-family: Impact, 'Arial Narrow', sans-serif; font-weight: 400; text-transform: uppercase; font-size: clamp(48px, 11vw, 140px); line-height: 1.1; }
    h1 span { color: #d98a2b; }
    p { margin: 0; max-width: 34em; color: rgba(239, 233, 223, .78); }
    a {
      display: inline-block; padding: 16px 24px; border-radius: 99px;
      background: #d98a2b; color: #0b0a09; text-decoration: none;
      font-family: ui-monospace, 'Courier New', monospace; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
    }
    a:hover, a:focus-visible { background: #efe9df; }
  </style>
</head>
<body>
  <div class="logo">dream</div>
  <h1>Ove stranice <span>nema.</span></h1>
  <p>Adresa je pogrešno ukucana ili je stranica obrisana. Sve majice su na početnoj strani.</p>
  <a href="https://aleksandarusljebrka.github.io/dream-clothing/">Nazad na početnu</a>
</body>
</html>
